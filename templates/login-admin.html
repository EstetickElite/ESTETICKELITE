<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo - EstetickElite</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="../static/css/style.css">

    <style>
        .login-admin {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            padding: 30px;
        }

        .login-admin-box {
            width: 100%;
            max-width: 430px;
            padding: 45px;
            background: #080808;
            border: 1px solid #333333;
            border-top: 2px solid #d4af37;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .login-admin-box img {
            width: 75px;
            margin-bottom: 20px;
        }

        .login-tag {
            display: block;
            color: #d4af37;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .login-admin-box h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-admin-box>p {
            color: #888888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .campo-login {
            text-align: left;
            margin-bottom: 20px;
        }

        .campo-login label {
            display: block;
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo-login input {
            width: 100%;
            padding: 13px 15px;
            background: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .campo-login input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.12);
        }

        .login-admin-box button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #d4af37;
            color: #050505;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-admin-box button:hover {
            background: #f5d76e;
            transform: translateY(-2px);
        }

        #mensagemLogin {
            min-height: 20px;
            margin-top: 15px;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-admin {
                padding: 20px;
            }

            .login-admin-box {
                padding: 30px 25px;
            }

            .login-admin-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-admin">

        <div class="login-admin-box">

            <!-- LOGO -->
            <img src="../static/img/logo.png" alt="Logo EstetickElite">

            <!-- IDENTIFICAÇÃO -->
            <span class="login-tag">
                ÁREA RESTRITA
            </span>

            <h1>
                Login Administrativo
            </h1>

            <p>
                Acesse o painel exclusivo da EstetickElite.
            </p>

            <!-- FORMULÁRIO -->
            <form id="loginAdmin">

                <!-- E-MAIL -->
                <div class="campo-login">
                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required>
                </div>

                <!-- SENHA -->
                <div class="campo-login">
                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password"
                        required>
                </div>

                <!-- BOTÃO -->
                <button type="submit">
                    Entrar no painel
                </button>

                <!-- MENSAGEM -->
                <p id="mensagemLogin"></p>

            </form>

        </div>

    </div>


    <script>

        // USUÁRIOS AUTORIZADOS
        const usuariosPermitidos = [
            {
                email: "samuelmoyses396@gmail.com",
                senha: "Sa191108@"
            }
        ];

        // USUÁRIOS AUTORIZADOS
        const usuariosPermitidos2 = [
            {
                email: "seguralucas949@gmail.com",
                senha: "Lu170209@"
            }
        ];


        // FORMULÁRIO DE LOGIN
        document.getElementById("loginAdmin").addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagemLogin");


            // VERIFICA E-MAIL E SENHA
            const usuarioEncontrado = usuariosPermitidos.find(function (usuario) {

                return usuario.email === email &&
                    usuario.senha === senha;

            });


            // LOGIN CORRETO
            if (usuarioEncontrado) {

                sessionStorage.setItem("adminLogado", "true");

                window.location.href = "./adm.html";

            }

            // LOGIN INCORRETO
            else {

                mensagem.textContent = "E-mail ou senha incorretos.";
                mensagem.style.color = "#d4af37";

            }

        });

    </script>

</body>

</html>
